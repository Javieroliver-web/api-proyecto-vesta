# Configuración Nginx con HTTPS para ambos dominios DuckDNS
# vesta-web.duckdns.org (34.175.116.7) - Puesto de trabajo (HTTP)
# vesta-web2.duckdns.org (34.175.81.8) - Casa (HTTPS)

# Configuración para vesta-web.duckdns.org (HTTP solamente)
server {
    listen 80;
    server_name vesta-web.duckdns.org 34.175.116.7;

    # Redirección de la raíz a /vesta-web/
    location = / {
        return 301 http://$host/vesta-web/;
    }

    # Configuración para todas las rutas de la aplicación web
    location /vesta-web/ {
        proxy_pass http://localhost:8080/vesta-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /vesta-web /;
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Server-IP $server_addr;
    }

    # Configuración para rutas del cliente (dashboard, etc.)
    location /cliente/ {
        proxy_pass http://localhost:8080/vesta-web/cliente/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /vesta-web /;
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Server-IP $server_addr;
    }

    # Redirección para URLs sin /vesta-web/ prefix
    location ~ ^/(login|register|cliente|admin)(.*)$ {
        return 301 http://$host/vesta-web/$1$2;
    }

    # Configuración para rutas de administrador
    location /admin/ {
        proxy_pass http://localhost:8080/vesta-web/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /vesta-web /;
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Server-IP $server_addr;
    }

    # Configuración para la API
    location /api/ {
        proxy_pass http://localhost:8080/vesta-api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /vesta-api /;
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Server-IP $server_addr;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK - vesta-web.duckdns.org (HTTP) - Server IP: $server_addr\n";
        add_header Content-Type text/plain;
    }
}

# Redirección HTTP a HTTPS para vesta-web2.duckdns.org
server {
    listen 80;
    server_name vesta-web2.duckdns.org 34.175.81.8;
    
    # Redireccionar todo el tráfico HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

# Configuración HTTPS para vesta-web2.duckdns.org
server {
    listen 443 ssl http2;
    server_name vesta-web2.duckdns.org 34.175.81.8;

    # Certificados SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/vesta-web2.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vesta-web2.duckdns.org/privkey.pem;
    
    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Redirección de la raíz a /vesta-web/
    location = / {
        return 301 https://$host/vesta-web/;
    }

    # Configuración para todas las rutas de la aplicación web
    location /vesta-web/ {
        proxy_pass http://localhost:8080/vesta-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_cookie_path /vesta-web /;
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Server-IP $server_addr;
        proxy_set_header X-Forwarded-SSL on;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Configuración para rutas del cliente (dashboard, etc.)
    location /cliente/ {
        proxy_pass http://localhost:8080/vesta-web/cliente/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_cookie_path /vesta-web /;
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Server-IP $server_addr;
        proxy_set_header X-Forwarded-SSL on;
    }

    # Redirección para URLs sin /vesta-web/ prefix
    location ~ ^/(login|register|cliente|admin)(.*)$ {
        return 301 https://$host/vesta-web/$1$2;
    }

    # Configuración para rutas de administrador
    location /admin/ {
        proxy_pass http://localhost:8080/vesta-web/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_cookie_path /vesta-web /;
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Server-IP $server_addr;
        proxy_set_header X-Forwarded-SSL on;
    }

    # Configuración para la API
    location /api/ {
        proxy_pass http://localhost:8080/vesta-api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_cookie_path /vesta-api /;
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Server-IP $server_addr;
        proxy_set_header X-Forwarded-SSL on;
    }

    # Health check HTTPS
    location /health {
        access_log off;
        return 200 "OK - vesta-web2.duckdns.org (HTTPS) - Server IP: $server_addr\n";
        add_header Content-Type text/plain;
    }

    # Configuración para archivos estáticos con caché
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        
        # Caché para archivos estáticos
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status "STATIC";
    }
}