# ===================================
# VESTA API - Cloud Hosting Profile
# ===================================
# Perfil para hosting gratuito permanente: Koyeb (app) + Neon (PostgreSQL)
# Activar con variable de entorno: SPRING_PROFILES_ACTIVE=cloud
#
# Variables de entorno requeridas en Koyeb (o cualquier host compatible):
#   SPRING_DATASOURCE_URL      -> jdbc:postgresql://ep-xxx.region.aws.neon.tech/vesta_db?sslmode=require
#   SPRING_DATASOURCE_USERNAME -> usuario de Neon
#   SPRING_DATASOURCE_PASSWORD -> password de Neon
#   JWT_SECRET                 -> clave secreta larga y aleatoria
#   MAIL_USERNAME              -> tu email de Gmail
#   MAIL_PASSWORD              -> app password de Gmail (16 caracteres)
#   FRONTEND_URL               -> URL del frontend web (ej: https://vesta-web.koyeb.app/vesta-web)
#   API_URL                    -> URL de esta API (ej: https://vesta-api.koyeb.app/vesta-api)
#   GOOGLE_CLIENT_ID           -> Client ID de Google OAuth2
#   GOOGLE_CLIENT_SECRET       -> Client Secret de Google OAuth2
#   CORS_ALLOWED_ORIGINS       -> Origenes permitidos (ej: https://vesta-web.koyeb.app)
#   TWILIO_ACCOUNT_SID         -> (opcional) SID de cuenta Twilio
#   TWILIO_AUTH_TOKEN          -> (opcional) Auth Token de Twilio
#   TWILIO_MESSAGING_SERVICE_SID -> (opcional) Messaging Service SID de Twilio

# === SERVIDOR ===
# Render inyecta el puerto via variable PORT
server.port=${PORT:8080}
server.servlet.context-path=/vesta-api
server.forward-headers-strategy=native

# === BASE DE DATOS (Neon PostgreSQL) ===
# Neon requiere SSL - incluir ?sslmode=require en la URL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool reducido para free tier (512MB RAM)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# === JPA / HIBERNATE ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
# Necesario para que data.sql se ejecute DESPUÉS de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

# === SQL INIT (data.sql) ===
# Fuerza la ejecución de data.sql en PostgreSQL externo (por defecto solo corre en H2)
spring.sql.init.mode=always

# === SEGURIDAD JWT ===
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# === CORS ===
# Separar múltiples orígenes con coma:
# ej: https://vesta-web.koyeb.app,https://mi-otro-dominio.com
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# === EMAIL (Gmail SMTP) ===
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_USERNAME}

# Frontend URL para links en emails (restablecimiento de contraseña, etc.)
app.frontend.url=${FRONTEND_URL}
app.api.url=${API_URL}

# === OAuth2 GOOGLE LOGIN ===
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
# URI dinámica - funciona con cualquier dominio automáticamente
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

# === MULTIPART ===
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# === LOGGING ===
logging.level.root=WARN
logging.level.com.vesta=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# === ACTUATOR / HEALTH CHECK ===
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false

# === COMPRESIÓN ===
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# === SCHEDULING ===
spring.task.scheduling.enabled=true

# === JACKSON ===
spring.jackson.serialization.write-dates-as-timestamps=false

# === TWILIO SMS (opcional) ===
vesta.twilio.account.sid=${TWILIO_ACCOUNT_SID:}
vesta.twilio.auth.token=${TWILIO_AUTH_TOKEN:}
vesta.twilio.messaging.service.sid=${TWILIO_MESSAGING_SERVICE_SID:}
sms.enabled=${SMS_ENABLED:false}
