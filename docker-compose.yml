version: '3.8'

services:
  db:
    image: postgres:17
    container_name: vesta-db  # Sin guiones bajos
    restart: unless-stopped
    environment:
      POSTGRES_USER: vesta_user
      POSTGRES_PASSWORD: vesta_password
      POSTGRES_DB: vesta_db
    ports:
      - "5433:5432"
    volumes:
      - vesta_pgdata:/var/lib/postgresql/data
    networks:
      - vesta_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesta_user -d vesta_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vesta-api  # Sin guiones bajos
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://vesta-db:5432/vesta_db  # Actualizado
      SPRING_DATASOURCE_USERNAME: vesta_user
      SPRING_DATASOURCE_PASSWORD: vesta_password
      JWT_SECRET: "ClaveSecretaSuperSeguraParaVestaProyecto2025"
      JWT_EXPIRATION: 86400000
      # Email configuration - Configurado para javip200555@gmail.com
      MAIL_USERNAME: javip200555@gmail.com
      MAIL_PASSWORD: jkyacxnhtsokpkur
      # SMS configuration - Twilio
      TWILIO_ACCOUNT_SID: AC773e7018a6264d128f3b19481fd7178d
      TWILIO_AUTH_TOKEN: 5e338c3a12b972e06b46c7d3f179b1cb
      TWILIO_MESSAGING_SERVICE_SID: MG2d938b15ef1a4b1c272e5e250f78c96b
    networks:
      - vesta_net

networks:
  vesta_net:
    name: vesta_network_shared
    driver: bridge

volumes:
  vesta_pgdata: