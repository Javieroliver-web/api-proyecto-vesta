server {
    # Configuración para dominio DuckDNS y ambas IPs
    server_name vesta-web.duckdns.org 34.175.116.7 34.175.81.8;
    listen 80;

    # Redirección de la raíz a /vesta-web/
    location = / {
        return 301 http://$host/vesta-web/;
    }

    # Configuración para todas las rutas de la aplicación web
    location /vesta-web/ {
        proxy_pass http://localhost:8080/vesta-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuración de cookies para compartir entre aplicaciones
        proxy_cookie_path /vesta-web /;
        
        # Headers adicionales para multi-IP
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Server-IP $server_addr;
    }

    # Configuración para rutas del cliente (dashboard, etc.)
    location /cliente/ {
        proxy_pass http://localhost:8080/vesta-web/cliente/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuración de cookies para compartir entre aplicaciones
        proxy_cookie_path /vesta-web /;
        
        # Headers adicionales para multi-IP
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Server-IP $server_addr;
    }

    # Redirección para URLs sin /vesta-web/ prefix
    location ~ ^/(login|register|cliente|admin)(.*)$ {
        return 301 http://$host/vesta-web/$1$2;
    }

    # Configuración para rutas de administrador
    location /admin/ {
        proxy_pass http://localhost:8080/vesta-web/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuración de cookies para compartir entre aplicaciones
        proxy_cookie_path /vesta-web /;
        
        # Headers adicionales para multi-IP
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Server-IP $server_addr;
    }

    # Configuración para la API
    location /api/ {
        proxy_pass http://localhost:8080/vesta-api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuración de cookies para compartir entre aplicaciones
        proxy_cookie_path /vesta-api /;
        
        # Headers adicionales para multi-IP
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Server-IP $server_addr;
    }

    # Configuración adicional para acceso directo por IP
    location /health {
        access_log off;
        return 200 "OK - Server IP: $server_addr\n";
        add_header Content-Type text/plain;
    }
}